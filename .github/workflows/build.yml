name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "test.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-15

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # FIND test.zip
      # ==========================================

      - name: Find test.zip
        shell: bash
        run: |
          set -e

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "test.zip" \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::test.zip was not found."
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$ZIP"


      # ==========================================
      # EXTRACT test.zip
      # ==========================================

      - name: Extract test.zip
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -oq "$ZIP" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "===== EXTRACTED FILES ====="

          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 15 \
            -print


      # ==========================================
      # INSTALL XCODEGEN
      # ==========================================

      - name: Install XcodeGen
        shell: bash
        run: |
          set -e

          brew install xcodegen

          echo "XcodeGen version:"
          xcodegen --version


      # ==========================================
      # FIND project.yml
      # ==========================================

      - name: Find project.yml
        shell: bash
        run: |
          set -e

          PROJECT_YML="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "project.yml" \
            -print -quit)"

          if [ -z "$PROJECT_YML" ]; then
            echo "::error::project.yml was not found."

            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 20 \
              -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_YML")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project.yml:"
          echo "$PROJECT_YML"


      # ==========================================
      # GENERATE XCODE PROJECT
      # ==========================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          xcodegen generate

          echo ""
          echo "===== GENERATED FILES ====="

          find "$PROJECT_DIR" \
            -maxdepth 4 \
            -print


      # ==========================================
      # FIND XCODE PROJECT
      # ==========================================

      - name: Find Xcode project
        shell: bash
        run: |
          set -e

          PROJECT="$(find "$PROJECT_DIR" \
            -type d \
            -name "*.xcodeproj" \
            -print -quit)"

          WORKSPACE="$(find "$PROJECT_DIR" \
            -type d \
            -name "*.xcworkspace" \
            -print -quit)"

          if [ -n "$WORKSPACE" ]; then

            echo "BUILD_TYPE=workspace" >> "$GITHUB_ENV"
            echo "XCODE_PATH=$WORKSPACE" >> "$GITHUB_ENV"

            echo "Using:"
            echo "$WORKSPACE"

          elif [ -n "$PROJECT" ]; then

            echo "BUILD_TYPE=project" >> "$GITHUB_ENV"
            echo "XCODE_PATH=$PROJECT" >> "$GITHUB_ENV"

            echo "Using:"
            echo "$PROJECT"

          else

            echo "::error::No Xcode project was generated."
            exit 1

          fi


      # ==========================================
      # LIST SCHEMES
      # ==========================================

      - name: List schemes
        shell: bash
        run: |
          set -e

          if [ "$BUILD_TYPE" = "workspace" ]; then

            xcodebuild \
              -list \
              -workspace "$XCODE_PATH" \
              | tee "$GITHUB_WORKSPACE/xcode-list.txt"

          else

            xcodebuild \
              -list \
              -project "$XCODE_PATH" \
              | tee "$GITHUB_WORKSPACE/xcode-list.txt"

          fi


      # ==========================================
      # DETERMINE SCHEME
      # ==========================================

      - name: Determine scheme
        shell: bash
        run: |
          set -e

          SCHEME="$(
            awk '
              /Schemes:/ {
                found=1
                next
              }

              found && NF {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "")
                print
                exit
              }
            ' "$GITHUB_WORKSPACE/xcode-list.txt"
          )"

          if [ -z "$SCHEME" ]; then
            echo "::error::No Xcode scheme found."
            cat "$GITHUB_WORKSPACE/xcode-list.txt"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Scheme:"
          echo "$SCHEME"


      # ==========================================
      # BUILD
      # ==========================================

      - name: Build app
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/build"

          DERIVED_DATA="$GITHUB_WORKSPACE/build"

          BUILD_ARGS=(
            -scheme "$SCHEME"
            -configuration Release
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -derivedDataPath "$DERIVED_DATA"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
          )

          if [ "$BUILD_TYPE" = "workspace" ]; then

            xcodebuild \
              -workspace "$XCODE_PATH" \
              "${BUILD_ARGS[@]}"

          else

            xcodebuild \
              -project "$XCODE_PATH" \
              "${BUILD_ARGS[@]}"

          fi


      # ==========================================
      # FIND APP
      # ==========================================

      - name: Find built app
        shell: bash
        run: |
          set -e

          APP="$(
            find "$GITHUB_WORKSPACE/build" \
              -type d \
              -name "*.app" \
              -path "*Release-iphoneos*" \
              -print -quit
          )"

          if [ -z "$APP" ]; then
            echo "::error::No .app was produced."

            find "$GITHUB_WORKSPACE/build" \
              -maxdepth 12 \
              -print

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "Found app:"
          echo "$APP"


      # ==========================================
      # CREATE PAYLOAD
      # ==========================================

      - name: Prepare IPA
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/ipa-work"
          rm -f "$GITHUB_WORKSPACE/unsigned.ipa"

          mkdir -p "$GITHUB_WORKSPACE/ipa-work/Payload"

          echo "Copying:"
          echo "$APP"

          cp -R "$APP" \
            "$GITHUB_WORKSPACE/ipa-work/Payload/"

          echo ""
          echo "Payload:"
          find "$GITHUB_WORKSPACE/ipa-work/Payload" \
            -maxdepth 3 \
            -print


      # ==========================================
      # CREATE IPA USING PYTHON
      # ==========================================

      - name: Create IPA
        shell: bash
        run: |
          set -e

          export IPA_PATH="$GITHUB_WORKSPACE/unsigned.ipa"
          export PAYLOAD_PATH="$GITHUB_WORKSPACE/ipa-work/Payload"

          python3 <<'PY'
          import os
          import zipfile

          ipa = os.environ["IPA_PATH"]
          payload = os.environ["PAYLOAD_PATH"]

          print("Creating:")
          print(ipa)

          with zipfile.ZipFile(
              ipa,
              "w",
              compression=zipfile.ZIP_DEFLATED
          ) as z:

              for root, dirs, files in os.walk(payload):
                  for filename in files:
                      full_path = os.path.join(root, filename)

                      relative_path = os.path.relpath(
                          full_path,
                          os.path.dirname(payload)
                      )

                      z.write(
                          full_path,
                          relative_path
                      )

          print("IPA created.")

          if not os.path.isfile(ipa):
              raise SystemExit("IPA was not created.")

          size = os.path.getsize(ipa)

          print(f"IPA size: {size:,} bytes")

          if size == 0:
              raise SystemExit("IPA is empty.")
          PY

          echo ""
          echo "===== IPA CREATED ====="
          ls -lh "$GITHUB_WORKSPACE/unsigned.ipa"


      # ==========================================
      # VERIFY IPA
      # ==========================================

      - name: Verify IPA
        shell: bash
        run: |
          set -e

          IPA="$GITHUB_WORKSPACE/unsigned.ipa"

          if [ ! -f "$IPA" ]; then
            echo "::error::unsigned.ipa does not exist."
            exit 1
          fi

          echo "IPA exists:"
          ls -lh "$IPA"

          echo ""
          echo "IPA contents:"

          unzip -l "$IPA"

          echo ""
          echo "Checking Payload..."

          unzip -l "$IPA" | grep "Payload/.*\.app/" >/dev/null

          echo "✅ IPA verification passed."


      # ==========================================
      # UPLOAD IPA
      # ==========================================

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ github.workspace }}/unsigned.ipa
          if-no-files-found: error


      # ==========================================
      # DIAGNOSTICS
      # ==========================================

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            xcode-list.txt
            build/
            ipa-work/
          if-no-files-found: ignore
