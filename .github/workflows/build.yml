name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "test.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-15

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # FIND test.zip
      # ==========================================

      - name: Find test.zip
        shell: bash
        run: |
          set -e

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "test.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "::error::test.zip was not found."
            exit 1
          fi

          echo "Found test.zip:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"


      # ==========================================
      # EXTRACT test.zip
      # ==========================================

      - name: Extract test.zip
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -oq \
            "$ZIP" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "===== ZIP CONTENTS ====="

          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 10 \
            -print


      # ==========================================
      # INSTALL XCODEGEN
      # ==========================================

      - name: Install XcodeGen
        shell: bash
        run: |
          set -e

          brew install xcodegen

          echo "XcodeGen:"
          xcodegen --version


      # ==========================================
      # FIND project.yml
      # ==========================================

      - name: Find project.yml
        shell: bash
        run: |
          set -e

          PROJECT_YML=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "project.yml" \
            -print -quit)

          if [ -z "$PROJECT_YML" ]; then
            echo "::error::project.yml was not found."

            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 20 \
              -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_YML")

          echo "PROJECT_YML=$PROJECT_YML" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$PROJECT_YML"


      # ==========================================
      # GENERATE XCODE PROJECT
      # ==========================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Running XcodeGen..."

          xcodegen generate

          echo ""
          echo "===== GENERATED PROJECT ====="

          find "$PROJECT_DIR" \
            -maxdepth 3 \
            -print


      # ==========================================
      # FIND GENERATED PROJECT
      # ==========================================

      - name: Find generated Xcode project
        shell: bash
        run: |
          set -e

          PROJECT=$(find "$PROJECT_DIR" \
            -type d \
            -name "*.xcodeproj" \
            -print -quit)

          WORKSPACE=$(find "$PROJECT_DIR" \
            -type d \
            -name "*.xcworkspace" \
            -print -quit)

          if [ -n "$WORKSPACE" ]; then

            echo "BUILD_TYPE=workspace" >> "$GITHUB_ENV"
            echo "XCODE_PATH=$WORKSPACE" >> "$GITHUB_ENV"

            echo "Using workspace:"
            echo "$WORKSPACE"

          elif [ -n "$PROJECT" ]; then

            echo "BUILD_TYPE=project" >> "$GITHUB_ENV"
            echo "XCODE_PATH=$PROJECT" >> "$GITHUB_ENV"

            echo "Using project:"
            echo "$PROJECT"

          else

            echo "::error::XcodeGen did not create an Xcode project."

            exit 1

          fi


      # ==========================================
      # SHOW SCHEMES
      # ==========================================

      - name: Show Xcode schemes
        shell: bash
        run: |
          set -e

          if [ "$BUILD_TYPE" = "workspace" ]; then

            xcodebuild \
              -list \
              -workspace "$XCODE_PATH" \
              | tee "$GITHUB_WORKSPACE/xcode-list.txt"

          else

            xcodebuild \
              -list \
              -project "$XCODE_PATH" \
              | tee "$GITHUB_WORKSPACE/xcode-list.txt"

          fi


      # ==========================================
      # GET SCHEME
      # ==========================================

      - name: Determine scheme
        shell: bash
        run: |
          set -e

          SCHEME=$(
            awk '
              /Schemes:/ {
                found=1
                next
              }

              found && NF {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "")
                print
                exit
              }
            ' "$GITHUB_WORKSPACE/xcode-list.txt"
          )

          if [ -z "$SCHEME" ]; then

            echo "::error::No Xcode scheme found."

            cat "$GITHUB_WORKSPACE/xcode-list.txt"

            exit 1

          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Using scheme:"
          echo "$SCHEME"


      # ==========================================
      # BUILD
      # ==========================================

      - name: Build iOS app
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/build"

          DERIVED_DATA="$GITHUB_WORKSPACE/build"

          if [ "$BUILD_TYPE" = "workspace" ]; then

            xcodebuild \
              -workspace "$XCODE_PATH" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$DERIVED_DATA" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

          else

            xcodebuild \
              -project "$XCODE_PATH" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$DERIVED_DATA" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

          fi


      # ==========================================
      # FIND APP
      # ==========================================

      - name: Find built app
        shell: bash
        run: |
          set -e

          echo "Searching for .app..."

          APP=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            -path "*Release-iphoneos*" \
            -print -quit)

          if [ -z "$APP" ]; then

            echo "::error::No .app was found."

            echo ""
            echo "===== BUILD DIRECTORY ====="

            find "$GITHUB_WORKSPACE/build" \
              -maxdepth 12 \
              -print

            exit 1

          fi

          echo "Found app:"
          echo "$APP"

          echo "APP=$APP" >> "$GITHUB_ENV"


      # ==========================================
      # CREATE IPA
      # ==========================================

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          IPA="$GITHUB_WORKSPACE/unsigned.ipa"
          PAYLOAD="$GITHUB_WORKSPACE/Payload"

          rm -rf "$PAYLOAD"
          rm -f "$IPA"

          mkdir -p "$PAYLOAD"

          echo "Copying app..."

          cp -R "$APP" "$PAYLOAD/"

          echo ""
          echo "Payload contents:"

          find "$PAYLOAD" -maxdepth 2 -print

          echo ""
          echo "Creating IPA..."

          cd "$GITHUB_WORKSPACE"

          /usr/bin/zip \
            -qry \
            "$IPA" \
            Payload

          echo ""
          echo "Checking IPA..."

          if [ ! -f "$IPA" ]; then
            echo "::error::IPA was not created!"
            exit 1
          fi

          echo ""
          echo "================================"
          echo "SUCCESS"
          echo "================================"

          ls -lh "$IPA"

          echo ""
          echo "IPA:"
          echo "$IPA"


      # ==========================================
      # VERIFY IPA
      # ==========================================

      - name: Verify IPA
        shell: bash
        run: |
          set -e

          if [ ! -f "$GITHUB_WORKSPACE/unsigned.ipa" ]; then
            echo "::error::unsigned.ipa does not exist."
            exit 1
          fi

          echo "IPA size:"
          du -h "$GITHUB_WORKSPACE/unsigned.ipa"

          echo ""
          echo "IPA contents:"

          unzip -l "$GITHUB_WORKSPACE/unsigned.ipa"


      # ==========================================
      # UPLOAD IPA
      # ==========================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ github.workspace }}/unsigned.ipa
          if-no-files-found: error


      # ==========================================
      # UPLOAD DIAGNOSTICS IF BUILD FAILS
      # ==========================================

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            xcode-list.txt
            build/
          if-no-files-found: ignore
