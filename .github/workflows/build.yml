name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "test.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Find test.zip
      # -----------------------------
      - name: Find test.zip
        shell: bash
        run: |
          set -e

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "test.zip" \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::test.zip was not found."
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$ZIP"

      # -----------------------------
      # Extract
      # -----------------------------
      - name: Extract test.zip
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -oq "$ZIP" -d extracted

          echo "===== Contents ====="
          find extracted -maxdepth 10 -print

      # -----------------------------
      # Install XcodeGen
      # -----------------------------
      - name: Install XcodeGen
        shell: bash
        run: |
          set -e

          brew install xcodegen

          xcodegen --version

      # -----------------------------
      # Find project.yml
      # -----------------------------
      - name: Find XcodeGen project
        shell: bash
        run: |
          set -e

          PROJECT_YML="$(find extracted \
            -type f \
            -name "project.yml" \
            -print -quit)"

          if [ -z "$PROJECT_YML" ]; then
            echo "::error::No project.yml found."
            find extracted -maxdepth 15 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_YML")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found XcodeGen project:"
          echo "$PROJECT_YML"

      # -----------------------------
      # Generate .xcodeproj
      # -----------------------------
      - name: Generate Xcode project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Generating Xcode project..."

          xcodegen generate

          echo ""
          echo "===== Generated files ====="
          find . -maxdepth 2 -print

      # -----------------------------
      # Find generated project
      # -----------------------------
      - name: Find generated Xcode project
        shell: bash
        run: |
          set -e

          PROJECT="$(find "$PROJECT_DIR" \
            -type d \
            -name "*.xcodeproj" \
            -print -quit)"

          WORKSPACE="$(find "$PROJECT_DIR" \
            -type d \
            -name "*.xcworkspace" \
            -print -quit)"

          if [ -n "$WORKSPACE" ]; then
            echo "TYPE=workspace" >> "$GITHUB_ENV"
            echo "XCODE_PATH=$WORKSPACE" >> "$GITHUB_ENV"

            echo "Using workspace:"
            echo "$WORKSPACE"

          elif [ -n "$PROJECT" ]; then
            echo "TYPE=project" >> "$GITHUB_ENV"
            echo "XCODE_PATH=$PROJECT"

            echo "Using project:"
            echo "$PROJECT"

          else
            echo "::error::XcodeGen did not create an Xcode project."
            exit 1
          fi

      # -----------------------------
      # List schemes
      # -----------------------------
      - name: List schemes
        shell: bash
        run: |
          set -e

          if [ "$TYPE" = "workspace" ]; then
            xcodebuild \
              -list \
              -workspace "$XCODE_PATH" \
              | tee xcode-list.txt
          else
            xcodebuild \
              -list \
              -project "$XCODE_PATH" \
              | tee xcode-list.txt
          fi

      # -----------------------------
      # Determine scheme
      # -----------------------------
      - name: Determine scheme
        shell: bash
        run: |
          set -e

          SCHEME="$(
            awk '
              /Schemes:/ {
                found=1
                next
              }

              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "")
                print
                exit
              }
            ' xcode-list.txt
          )"

          if [ -z "$SCHEME" ]; then
            echo "::error::No scheme found."

            cat xcode-list.txt

            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Using scheme:"
          echo "$SCHEME"

      # -----------------------------
      # Build unsigned app
      # -----------------------------
      - name: Build unsigned app
        shell: bash
        run: |
          set -e

          rm -rf build

          COMMON_ARGS=(
            -scheme "$SCHEME"
            -configuration Release
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -derivedDataPath "$GITHUB_WORKSPACE/build"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
          )

          if [ "$TYPE" = "workspace" ]; then

            xcodebuild \
              -workspace "$XCODE_PATH" \
              "${COMMON_ARGS[@]}"

          else

            xcodebuild \
              -project "$XCODE_PATH" \
              "${COMMON_ARGS[@]}"

          fi

      # -----------------------------
      # Find .app
      # -----------------------------
      - name: Find built app
        shell: bash
        run: |
          set -e

          APP="$(
            find build \
              -type d \
              -name "*.app" \
              -path "*Release-iphoneos*" \
              -print -quit
          )"

          if [ -z "$APP" ]; then
            echo "::error::No .app was produced."

            find build -maxdepth 10 -print

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "Built:"
          echo "$APP"

      # -----------------------------
      # Create IPA
      # -----------------------------
      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R "$APP" ipa/Payload/

          cd ipa

          zip -qry \
            "$GITHUB_WORKSPACE/unsigned.ipa" \
            Payload

          cd "$GITHUB_WORKSPACE"

          echo "===== IPA ====="
          ls -lh unsigned.ipa

      # -----------------------------
      # Upload IPA
      # -----------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: unsigned.ipa
          if-no-files-found: error

      # -----------------------------
      # Upload diagnostics if failed
      # -----------------------------
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            xcode-list.txt
            build/
          if-no-files-found: ignore
